name: Build macOS

# Builds and validates a universal arm64/x86_64 component without publishing a
# GitHub release. release.yml uses the same ci-build.sh entry point.
on:
  workflow_call:
    inputs:
      ref:
        description: "Branch / tag / SHA to build (default: triggering ref)"
        required: false
        type: string
        default: ""
      version:
        description: "Version to stamp into the component (default: version.txt)"
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch / tag / SHA to build (default: selected ref)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout foo_navidrome
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
          path: foobar2000/foo_navidrome

      - name: Checkout foobar2000 SDK bundle
        uses: actions/checkout@v6
        with:
          repository: reupen/foobar2000-sdk-unmodified
          ref: 5fb30e4cf97d03edafc214febfb5e30597015b38
          path: _sdk-staging

      - name: Move SDK subdirs into the expected sibling layout
        run: |
          set -euo pipefail
          SDK_INNER="_sdk-staging/foobar2000"
          for d in SDK helpers shared foobar2000_component_client helpers-mac; do
            if [ -d "$SDK_INNER/$d" ]; then
              mv "$SDK_INNER/$d" "foobar2000/$d"
              echo "moved $SDK_INNER/$d -> foobar2000/$d"
            fi
          done
          for d in pfc libPPUI columns_ui-sdk; do
            if [ -d "_sdk-staging/$d" ]; then
              mv "_sdk-staging/$d" "$d"
              echo "moved _sdk-staging/$d -> $d"
            fi
          done
          for d in foobar2000/SDK foobar2000/helpers foobar2000/helpers-mac \
                   foobar2000/shared foobar2000/foobar2000_component_client pfc; do
            if [ ! -d "$d" ]; then
              echo "ERROR: required dir '$d' not found after staging." >&2
              exit 1
            fi
          done
          rm -rf _sdk-staging

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Resolve version and build universal component
        id: build
        working-directory: foobar2000/foo_navidrome
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="$REQUESTED_VERSION"
          if [ -z "$version" ]; then version="$(cat version.txt)"; fi
          ./scripts/ci-build.sh "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Upload xcodebuild log on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: xcodebuild-log
          path: /tmp/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload universal component
        uses: actions/upload-artifact@v6
        with:
          name: macos-component
          path: foobar2000/foo_navidrome/foo_navidrome_${{ steps.build.outputs.version }}.fb2k-component
          if-no-files-found: error
          retention-days: 14
