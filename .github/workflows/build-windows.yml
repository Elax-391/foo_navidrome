name: Build Windows

# Builds Windows Win32, x64, and ARM64EC DLLs and packages them in the
# foobar2000 v2 multi-architecture layout. Two entry points:
#
#   * workflow_call  — invoked by release.yml to attach the component to a
#                      GitHub release (caller passes the tag ref + version).
#   * workflow_dispatch — on-demand test builds (e.g. via win-test.sh), which
#                      download the resulting artifact and install it into a
#                      local Wine foobar2000 without cutting a release.
#
# Either way the job uploads a `windows-component` artifact containing the
# packaged .fb2k-component plus all three raw DLLs.

on:
  workflow_call:
    inputs:
      ref:
        description: "Branch / tag / SHA to build (default: triggering ref)"
        required: false
        type: string
        default: ""
      version:
        description: "Version to stamp into the DLL (default: read version.txt)"
        required: false
        type: string
        default: ""
    outputs:
      artifact-name:
        description: "Name of the uploaded artifact"
        value: ${{ jobs.build.outputs.artifact-name }}
      asset-name:
        description: "Filename of the packaged .fb2k-component"
        value: ${{ jobs.build.outputs.asset-name }}
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch / tag / SHA to build (default: selected ref)"
        required: false
        type: string
        default: ""

jobs:
  build:
    # windows-2022 ships a supported Visual Studio toolset with the ATL/MFC
    # component preinstalled.
    # windows-latest moved to VS 2026, which has no ATL — building there meant a
    # slow `vs_installer modify` on every run. Pinning to windows-2022 gets ATL
    # for free; WTL (atlapp.h, not in any VS image) is vendored in the repo.
    runs-on: windows-2022

    outputs:
      artifact-name: ${{ steps.pkg.outputs.artifact_name }}
      asset-name: ${{ steps.pkg.outputs.asset_name }}

    steps:
      # Sibling-directory layout the vcxproj expects, minus helpers-mac (Windows
      # doesn't need it). When called from release.yml, inputs.ref is the tag;
      # for a dispatch it falls back to the selected branch (github.ref).
      - name: Checkout foo_navidrome
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
          path: foobar2000/foo_navidrome

      - name: Checkout foobar2000 SDK bundle
        uses: actions/checkout@v6
        with:
          repository: reupen/foobar2000-sdk-unmodified
          ref: 5fb30e4cf97d03edafc214febfb5e30597015b38
          path: _sdk-staging

      - name: Move SDK subdirs into the expected sibling layout
        shell: bash
        run: |
          set -euo pipefail
          SDK_INNER="_sdk-staging/foobar2000"
          for d in SDK helpers shared foobar2000_component_client; do
            if [ -d "$SDK_INNER/$d" ]; then
              mv "$SDK_INNER/$d" "foobar2000/$d"
              echo "moved $SDK_INNER/$d -> foobar2000/$d"
            fi
          done
          # pfc is referenced directly; libPPUI / columns_ui-sdk are pulled in
          # transitively by the SDK helper projects. Stage whatever is present.
          for d in pfc libPPUI columns_ui-sdk; do
            if [ -d "_sdk-staging/$d" ]; then
              mv "_sdk-staging/$d" "$d"
              echo "moved _sdk-staging/$d -> $d"
            fi
          done
          for d in foobar2000/SDK foobar2000/helpers foobar2000/shared \
                   foobar2000/foobar2000_component_client pfc; do
            if [ ! -d "$d" ]; then
              echo "ERROR: required dir '$d' not found after staging." >&2
              echo "Contents of _sdk-staging root:" >&2
              ls -la _sdk-staging 2>/dev/null || true
              echo "Contents of _sdk-staging/foobar2000:" >&2
              ls -la _sdk-staging/foobar2000 2>/dev/null || true
              exit 1
            fi
          done
          rm -rf _sdk-staging

      # main.cpp reads COMPONENT_VERSION from version_generated.h when present
      # (else falls back to "1.0.0"). The Windows vcxproj has no version-header
      # build phase, so synthesize it from the explicit input or version.txt.
      - name: Resolve version + generate version_generated.h
        shell: bash
        working-directory: foobar2000/foo_navidrome
        run: |
          set -euo pipefail
          V="${{ inputs.version }}"
          if [ -z "$V" ]; then V="$(cat version.txt)"; fi
          printf '#pragma once\n#define COMPONENT_VERSION "%s"\n' "$V" > version_generated.h
          echo "VERSION=$V" >> "$GITHUB_ENV"
          echo "version_generated.h -> COMPONENT_VERSION \"$V\""

      # The SDK helpers/shared projects include WTL headers (<atlapp.h>, etc.),
      # which ship in no Visual Studio image. WTL is vendored in the repo
      # (Windows/third_party/wtl) so there's no per-run download. Drop a root
      # Directory.Build.targets that prepends its Include dir to IncludePath for
      # every project in the build (SDK + ours) — MSBuild auto-imports that file
      # from the workspace root the .vcxproj files sit under. (ATL itself is
      # already present via the windows-2022 image.)
      - name: Wire vendored WTL into the include path
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $wtl = "$env:GITHUB_WORKSPACE\foobar2000\foo_navidrome\Windows\third_party\wtl\Include"
          if (-not (Test-Path "$wtl\atlapp.h")) { Write-Error "vendored WTL missing: $wtl\atlapp.h"; exit 1 }
          Write-Host "WTL include: $wtl"
          # Directory.Build.targets is imported last (after the Cpp targets have
          # built IncludePath), so prepending here reliably wins.
          @"
          <Project>
            <PropertyGroup>
              <IncludePath>$wtl;`$(IncludePath)</IncludePath>
            </PropertyGroup>
          </Project>
          "@ | Set-Content -Path "$env:GITHUB_WORKSPACE\Directory.Build.targets" -Encoding utf8

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Build and run Windows tests
        shell: pwsh
        working-directory: foobar2000/foo_navidrome
        run: |
          $ErrorActionPreference = 'Stop'
          $sln = "$PWD\"
          $toolsetProbe = msbuild Windows\tests\ServerProfilesTests.vcxproj `
            /getProperty:DefaultPlatformToolset `
            /p:Configuration=Release /p:Platform=x64 /nologo
          $toolset = ($toolsetProbe | Select-Object -Last 1).ToString().Trim()
          if ([string]::IsNullOrWhiteSpace($toolset)) { Write-Error "Unable to resolve the installed MSVC toolset"; exit 1 }
          Write-Host "Using default MSVC toolset: $toolset"
          # Standalone test executables are emitted under test-out while the
          # SDK's shared runtime outputs are under x64\Release. Keep that
          # directory discoverable even when a test is launched outside the
          # project output directory.
          $env:PATH = "$PWD\x64\Release;$env:PATH"
          # The projection test links the same SDK static libraries as the DLL.
          # Build the x64 prerequisite once before compiling the standalone tests;
          # the release matrix below reuses the resulting incremental outputs.
          msbuild Windows\foo_navidrome.vcxproj `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:PlatformToolset=$toolset `
            /p:SolutionDir=$sln `
            /m /nologo /v:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tests = @(
            @{ Project = 'Windows\tests\SongMetadataTests.vcxproj';    Exe = 'SongMetadataTests.exe' },
            @{ Project = 'Windows\tests\MediaEnrichmentTests.vcxproj'; Exe = 'MediaEnrichmentTests.exe' },
            @{ Project = 'Windows\tests\LibraryImportTests.vcxproj';   Exe = 'LibraryImportTests.exe' },
            @{ Project = 'Windows\tests\SubsonicExtrasTests.vcxproj';  Exe = 'SubsonicExtrasTests.exe' },
            @{ Project = 'Windows\tests\BrowserExtrasTests.vcxproj';   Exe = 'BrowserExtrasTests.exe' },
            @{ Project = 'Windows\tests\ScrobbleTests.vcxproj';        Exe = 'ScrobbleTests.exe' },
            @{ Project = 'Windows\tests\ServerProfilesTests.vcxproj';  Exe = 'ServerProfilesTests.exe' }
          )
          foreach ($test in $tests) {
            $name = [IO.Path]::GetFileNameWithoutExtension($test.Project)
            $out = "$PWD\test-out\$name\"
            msbuild $test.Project `
              /p:Configuration=Release `
              /p:Platform=x64 `
              /p:PlatformToolset=$toolset `
              /p:SolutionDir=$sln `
              /p:OutDir=$out `
              /m /nologo /v:minimal
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $exe = Join-Path $out $test.Exe
            if (-not (Test-Path -LiteralPath $exe)) {
              Write-Error "Test executable not found: $exe"
              exit 1
            }
            Write-Host "Running $exe"
            $process = Start-Process -FilePath $exe -WorkingDirectory $PWD -NoNewWindow -Wait -PassThru
            Write-Host "$($test.Exe) exited with code $($process.ExitCode)"
            if ($process.ExitCode -ne 0) { exit $process.ExitCode }
          }

      - name: Build Release (Win32 + x64 + ARM64EC)
        shell: pwsh
        working-directory: foobar2000/foo_navidrome
        run: |
          $ErrorActionPreference = 'Stop'
          $sln = "$PWD\"
          $log = "$env:RUNNER_TEMP\msbuild.log"
          $dist = "$PWD\dist"

          function Resolve-PlatformToolset {
            param([Parameter(Mandatory = $true)][string]$Platform)

            $toolsetProbe = msbuild Windows\foo_navidrome.vcxproj `
              /getProperty:DefaultPlatformToolset `
              /p:Configuration=Release /p:Platform=$Platform /nologo
            $toolset = ($toolsetProbe | Select-Object -Last 1).ToString().Trim()
            if ([string]::IsNullOrWhiteSpace($toolset)) {
              throw "Unable to resolve the default MSVC toolset for $Platform"
            }

            $toolsProbe = msbuild Windows\foo_navidrome.vcxproj `
              /getProperty:VCToolsInstallDir `
              /p:Configuration=Release /p:Platform=$Platform `
              /p:PlatformToolset=$toolset /nologo
            $toolsDir = ($toolsProbe | Select-Object -Last 1).ToString().Trim()
            if ([string]::IsNullOrWhiteSpace($toolsDir)) {
              throw "Unable to resolve VCToolsInstallDir for $Platform ($toolset)"
            }

            $compilerTarget = switch ($Platform) {
              'Win32' { 'x86' }
              'x64' { 'x64' }
              'ARM64EC' { 'arm64' }
              default { throw "Unsupported target platform: $Platform" }
            }
            $compiler = Join-Path $toolsDir "bin\Hostx64\$compilerTarget\cl.exe"
            if (-not (Test-Path -LiteralPath $compiler)) {
              throw "MSVC compiler for $Platform is missing: $compiler. Install the matching C++ build tools component."
            }

            Write-Host "Using $toolset for $Platform ($compiler)"
            return $toolset
          }

          function Assert-PeMachine {
            param(
              [Parameter(Mandatory = $true)][string]$Path,
              [Parameter(Mandatory = $true)][UInt16]$Expected,
              [Parameter(Mandatory = $true)][string]$Platform
            )
            $stream = [System.IO.File]::OpenRead($Path)
            $reader = [System.IO.BinaryReader]::new($stream)
            try {
              if ($reader.ReadUInt16() -ne 0x5A4D) { throw "$Platform output is not a PE file: $Path" }
              $stream.Position = 0x3C
              $peOffset = $reader.ReadInt32()
              if ($peOffset -lt 0 -or $peOffset -gt ($stream.Length - 6)) { throw "$Platform output has an invalid PE offset: $Path" }
              $stream.Position = $peOffset
              if ($reader.ReadUInt32() -ne 0x00004550) { throw "$Platform output has an invalid PE signature: $Path" }
              $actual = $reader.ReadUInt16()
            } finally {
              $reader.Dispose()
              $stream.Dispose()
            }
            if ($actual -ne $Expected) {
              throw ("{0} PE machine mismatch: expected 0x{1:X4}, got 0x{2:X4}" -f $Platform, $Expected, $actual)
            }
            Write-Host ("verified {0} PE machine 0x{1:X4}: {2}" -f $Platform, $actual, $Path)
          }

          $targets = @(
            @{ Platform = 'Win32';   ZipSub = '';        Machine = [UInt16]0x014C },
            @{ Platform = 'x64';     ZipSub = 'x64';     Machine = [UInt16]0x8664 },
            @{ Platform = 'ARM64EC'; ZipSub = 'arm64ec'; Machine = [UInt16]0xA641 }
          )
          foreach ($target in $targets) {
            $platform = $target.Platform
            $platformToolset = Resolve-PlatformToolset -Platform $platform
            $out = "$PWD\out\$platform\"
            # Retarget all project references to the platform's installed
            # default toolset. The repository itself does not pin v143/v145.
            msbuild Windows\foo_navidrome.vcxproj `
              /p:Configuration=Release `
              /p:Platform=$platform `
              /p:PlatformToolset=$platformToolset `
              /p:SolutionDir=$sln `
              /p:OutDir=$out `
              /m /nologo /v:minimal `
              /flp:"logfile=$log;verbosity=detailed;append" `
              "/clp:ErrorsOnly;Summary"
            if ($LASTEXITCODE -ne 0) {
              Write-Host "===== MSBuild FAILED for $platform (rc=$LASTEXITCODE) — error lines ====="
              if (Test-Path $log) { Select-String -Path $log -Pattern 'error|fatal' | Select-Object -Last 60 | ForEach-Object { $_.Line } }
              exit $LASTEXITCODE
            }
            $dll = "$out\foo_navidrome.dll"
            if (-not (Test-Path -LiteralPath $dll)) { Write-Error "foo_navidrome.dll not found for $platform at $dll"; exit 1 }
            Assert-PeMachine -Path $dll -Expected $target.Machine -Platform $platform
            $destDir = if ($target.ZipSub) { "$dist\$($target.ZipSub)" } else { $dist }
            New-Item -ItemType Directory -Force -Path $destDir | Out-Null
            Copy-Item -LiteralPath $dll -Destination "$destDir\foo_navidrome.dll" -Force
            Write-Host "built $platform -> $destDir\foo_navidrome.dll"
          }

      - name: Upload msbuild log on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: msbuild-log
          path: ${{ runner.temp }}/msbuild.log
          if-no-files-found: ignore
          retention-days: 7

      # The Windows-only component contains exactly the three architecture DLLs.
      - name: Package .fb2k-component
        id: pkg
        shell: pwsh
        working-directory: foobar2000/foo_navidrome
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = "$PWD\dist"
          $asset = "foo_navidrome_win_$env:VERSION.fb2k-component"
          $zip = "$dist\$asset"
          Compress-Archive -Path "$dist\foo_navidrome.dll","$dist\x64","$dist\arm64ec" -DestinationPath "$dist\_tmp.zip" -Force
          Move-Item "$dist\_tmp.zip" $zip -Force
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zip)
          try {
            $entries = @($archive.Entries | ForEach-Object { $_.FullName.Replace('\', '/') } | Sort-Object)
            $expected = @('arm64ec/foo_navidrome.dll', 'foo_navidrome.dll', 'x64/foo_navidrome.dll')
            $difference = @(Compare-Object -ReferenceObject $expected -DifferenceObject $entries)
            if ($entries.Count -ne 3 -or $difference.Count -ne 0) {
              Write-Error "Unexpected component entries: $($entries -join ', ')"
              exit 1
            }
          } finally {
            $archive.Dispose()
          }
          "asset_name=$asset"            | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "artifact_name=windows-component" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "packaged: $zip"

      # Upload the package and raw DLLs for release merge and direct testing.
      - name: Upload component artifact
        uses: actions/upload-artifact@v6
        with:
          name: windows-component
          path: |
            foobar2000/foo_navidrome/dist/foo_navidrome_win_*.fb2k-component
            foobar2000/foo_navidrome/dist/foo_navidrome.dll
            foobar2000/foo_navidrome/dist/x64/foo_navidrome.dll
            foobar2000/foo_navidrome/dist/arm64ec/foo_navidrome.dll
          if-no-files-found: error
          retention-days: 14
