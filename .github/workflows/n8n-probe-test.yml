name: n8n-probe-test
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe n8n webhook auth
        env:
          N8N_WEBHOOK_URL: ${{ secrets.N8N_FOOBAR_RELEASE_WEBHOOK_URL }}
          N8N_WEBHOOK_SECRET: ${{ secrets.N8N_FOOBAR_RELEASE_WEBHOOK_SECRET }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -uo pipefail
          BASE="${N8N_WEBHOOK_URL%/webhook/*}"
          echo "--- GET base host (headers) ---"
          curl -sS -D- -m 15 "$BASE/" 2>&1 | head -c 1200 || echo "base failed exit=$?"
          echo
          echo "--- POST webhook (full real payload shape) ---"
          curl -sS -X POST "$N8N_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "X-Webhook-Secret: ${N8N_WEBHOOK_SECRET}" \
            -H "CF-Access-Client-Id: ${CF_ACCESS_CLIENT_ID}" \
            -H "CF-Access-Client-Secret: ${CF_ACCESS_CLIENT_SECRET}" \
            -d "{\"version\":\"probe\",\"changelog\":\"probe\",\"asset_url\":\"$BASE/nonexistent-probe-404\",\"asset_name\":\"probe.fb2k-component\"}" \
            -w "\nHTTP_CODE=%{http_code}\n" || echo "post failed exit=$?"