name: Release

on:
  push:
    branches: [main]

# semantic-release needs to commit version.txt + CHANGELOG.md back to main
# and create GitHub releases / tags.
permissions:
  contents: write
  issues: write
  pull-requests: write

# Cancel in-flight releases if a new push lands (prevents two concurrent
# semantic-release runs racing on the same tag).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-14
    # Skip the release commit semantic-release itself pushes (avoids loops).
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    steps:
      # ----------------------------------------------------------------------
      # Lay out the sibling-directory tree foo_navidrome expects:
      #
      #   {GITHUB_WORKSPACE}/
      #     pfc/                              ← marc2k3/pfc
      #     foobar2000/
      #       SDK/, helpers/, shared/,        ← marc2k3/foobar2000-sdk
      #       foobar2000_component_client/
      #       helpers-mac/                    ← (if present in SDK repo)
      #       foo_navidrome/                  ← this repo
      # ----------------------------------------------------------------------
      - name: Checkout foo_navidrome
        uses: actions/checkout@v6
        with:
          fetch-depth: 0           # semantic-release needs full history
          persist-credentials: true
          path: foobar2000/foo_navidrome

      - name: Checkout foobar2000 SDK bundle
        uses: actions/checkout@v6
        with:
          repository: marc2k3/foobar2000-sdk
          path: _sdk-staging

      - name: Move SDK subdirs into the expected sibling layout
        run: |
          set -euo pipefail
          # SDK + Mac helpers + component client live under ./foobar2000/
          for d in SDK helpers shared foobar2000_component_client helpers-mac; do
            if [ -d "_sdk-staging/$d" ]; then
              mv "_sdk-staging/$d" "foobar2000/$d"
              echo "moved _sdk-staging/$d -> foobar2000/$d"
            fi
          done
          # pfc lives at the workspace root (sibling of foobar2000/)
          if [ -d "_sdk-staging/pfc" ]; then
            mv "_sdk-staging/pfc" "pfc"
            echo "moved _sdk-staging/pfc -> pfc"
          fi
          # Verify everything we need is present before continuing
          for d in foobar2000/SDK foobar2000/helpers foobar2000/shared \
                   foobar2000/foobar2000_component_client pfc; do
            if [ ! -d "$d" ]; then
              echo "ERROR: required dir '$d' not found after staging." >&2
              echo "Contents of _sdk-staging (if it still exists):" >&2
              ls -la _sdk-staging 2>/dev/null || true
              exit 1
            fi
          done
          rm -rf _sdk-staging

      # ----------------------------------------------------------------------
      # Toolchain
      # ----------------------------------------------------------------------
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install semantic-release + plugins
        working-directory: foobar2000/foo_navidrome
        run: |
          npm install --no-save --no-package-lock \
            semantic-release@22 \
            conventional-changelog-conventionalcommits@7 \
            @semantic-release/changelog@6 \
            @semantic-release/git@10 \
            @semantic-release/exec@6 \
            @semantic-release/github@9

      # ----------------------------------------------------------------------
      # Release
      # ----------------------------------------------------------------------
      - name: Run semantic-release
        working-directory: foobar2000/foo_navidrome
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
